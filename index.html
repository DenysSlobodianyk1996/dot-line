<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8">
    <!-- logo favicon: SVG that follows the tab bar's color scheme, .ico for older browsers (VR-40, VR-41).
         Vite prefixes these public paths with the base (/dot-line/ on Pages) at build time. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Точки й лінії</title>
    <script>
      // pick the theme before the app loads so a dark device doesn't flash cream (same rule as useTheme)
      try {
        var saved = localStorage.getItem('THEME')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
