  <div style="max-width: 520px;">

      </fieldset>
      <fieldset style="margin: 0; min-width: 0; flex: 0 0 auto; display: flex; flex-direction: column; gap: 12px; border-radius: 20px; border: 1px solid var(--wc-border); padding: 16px; background: var(--wc-surface);">

          <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--wc-ink-soft);">Ім’я</div>
