<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; background: #ffffff; color: #000000; line-height: 1.5; font-family: ui-sans-serif, system-ui, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol', 'Noto Color Emoji'; }
    *, *::before, *::after { box-sizing: border-box; }
    a { color: #155dfc; } a:hover { color: #1447e6; }
  </style>
</helmet>

<div style="width: 560px; min-height: 330px; padding: 8px; background: #ffffff;">
  <div style="max-width: 520px;">
    <h3 style="margin: 0 0 16px; width: 100%; text-align: center; font-size: 20px; line-height: 28px; font-weight: 700;">Game Setup</h3>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <div style="display: flex; flex-direction: row; gap: 8px;">
      <fieldset style="margin: 0; min-width: 0; flex: 1 1 0; display: flex; gap: 8px; border-radius: 8px; border: 1px solid #d1d5dc; padding: 16px;">
        <legend style="padding: 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #364153;">Player 1</legend>
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-width: 0;">
          <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: #364153;">Name</div>
          <div style="width: 100%; min-height: 38px; border-radius: 6px; border: 1px solid #d1d5dc; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #101828; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);">Ann</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: #364153;">Color</div>
          <div style="width: 40px; height: 38px; flex-shrink: 0; border-radius: 6px; border: 1px solid #d1d5dc; background: #ffffff; padding: 4px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);"><div style="width: 100%; height: 100%; border-radius: 5px; background: #cd3f5a;"></div></div>
        </div>
      </fieldset>
      <fieldset style="margin: 0; min-width: 0; flex: 1 1 0; display: flex; gap: 8px; border-radius: 8px; border: 1px solid #d1d5dc; padding: 16px;">
        <legend style="padding: 0 8px; font-size: 14px; line-height: 20px; font-weight: 600; color: #364153;">Player 2</legend>
        <div style="display: flex; flex-direction: column; gap: 8px; flex: 1 1 0; min-width: 0;">
          <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: #364153;">Name</div>
          <div style="width: 100%; min-height: 38px; border-radius: 6px; border: 1px solid #d1d5dc; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #101828; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);">Bob</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: #364153;">Color</div>
          <div style="width: 40px; height: 38px; flex-shrink: 0; border-radius: 6px; border: 1px solid #d1d5dc; background: #ffffff; padding: 4px; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);"><div style="width: 100%; height: 100%; border-radius: 5px; background: #32a06e;"></div></div>
        </div>
      </fieldset>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: #364153;">Size</div>
        <div style="width: 100%; min-height: 38px; border-radius: 6px; border: 1px solid #d1d5dc; background: #ffffff; padding: 8px 12px; font-size: 14px; line-height: 20px; color: #101828; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);">4</div>
      </div>
      <div style="display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: #155dfc; padding: 8px 16px; font-size: 14px; line-height: 20px; font-weight: 500; color: #ffffff; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1); cursor: pointer;">Save</div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
