name: Android release

# A version tag builds a signed AAB and uploads it to the Play internal testing track (AR-10).
# Release: git tag vX.Y.Z && git push origin vX.Y.Z. versionName/versionCode come from the tag (AR-11).
# Secrets (written by scripts/android-release-wizard.sh): ANDROID_KEYSTORE_BASE64,
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
# GitHub masks secret values in the logs; no step prints them or runs with `set -x`.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # fails on a malformed tag (e.g. v1.2, v1.2.3-beta) before anything is built
      - name: Version from the tag
        run: node scripts/android-version.ts "$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint-check

      - name: Test
        run: npm test

      - name: Web build (capacitor mode)
        run: npm run build:capacitor

      - name: Copy the web build into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # the keystore lives in $RUNNER_TEMP, outside the checkout, and is deleted at the end of the job
      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing; run scripts/android-release-wizard.sh"
            exit 1
          fi
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "ANDROID_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Build the signed AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      # before the Play upload, so the AAB is there even when that step fails
      # (the first release must be uploaded by hand: docs/store/publishing-checklist.md, step 4)
      - name: Attach the AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ env.ANDROID_VERSION_NAME }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.dotsandboxes
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.ANDROID_VERSION_NAME }}
          track: internal
          status: completed

      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
