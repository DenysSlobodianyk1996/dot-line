name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # skip deploys when a push touches only files that don't change the built site;
    # a push that also touches anything else (src/, public/, configs, ...) still deploys
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.vscode/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.prettierrc.json'
      - '.oxlintrc.json'
      - 'eslint.config.ts'
      - 'LICENSE'
  # manual "Run workflow" button in the Actions tab, for forcing a deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # a failing test blocks the deploy (CM-40)
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # the site is served from https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback for history-mode routes
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
